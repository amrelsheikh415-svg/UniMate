:root[data-theme="light"]{color-scheme:light}

.forest-quest{border:1px solid color-mix(in srgb,var(--mint) 30%,var(--line));background:linear-gradient(145deg,color-mix(in srgb,var(--mint) 9%,var(--surface)),var(--surface))}.questline{display:flex;align-items:center;gap:10px;margin:12px 0}.questline>span:first-child{font-size:1.5rem}.questline>div{flex:1}.questline b{display:block}.questline small{color:var(--muted)}.questline .bar{margin:6px 0 0}.quest-reward{border-radius:12px;background:color-mix(in srgb,var(--sun) 14%,var(--surface));padding:10px 12px;margin-top:10px}
/* التايمر */
.ring.tring{width:200px;height:200px;margin:14px auto}
.tring>*{position:relative}
.tring .plant{font-size:2.6rem;margin:0;line-height:1.1}

.timer .picks button{padding:8px 4px;font-size:.85rem}
.timer #tGo{min-width:140px}
/* أرض الزراعة */
.plot{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--mint) 16%,var(--surface));border:1px solid var(--line)}
.cell{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:clamp(20px,6.4vw,32px);line-height:1;background:color-mix(in srgb,#9a6b3f 24%,var(--surface))}
.cell:not(.on)::after{content:"";width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,#6b4423 40%,transparent)}
.cell.next{outline:2px dashed var(--mint);outline-offset:-3px}
.cell.next::after{content:"+";width:auto;height:auto;border-radius:0;background:none;color:var(--mint);font-size:1.1rem;font-weight:700}
.cell.on{background:color-mix(in srgb,var(--mint) 22%,var(--surface))}
.cell.new{background:color-mix(in srgb,var(--mint) 38%,var(--surface))}
.cell.new span{display:block;animation:plant .9s cubic-bezier(.3,1.5,.5,1) both}
.cell.new::before{content:"";position:absolute;inset:0;border-radius:10px;border:2px solid var(--mint);animation:ripple 1.3s ease-out both}
@keyframes plant{0%{transform:translateY(12px) scale(0);opacity:0}60%{transform:translateY(-4px) scale(1.3);opacity:1}100%{transform:none}}
@keyframes ripple{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.cell.new span,.cell.new::before{animation:none}}
:root{--sky1:#bfe0ff;--sky2:#f4faff;--sunc:#ffc31f;--hill1:#a9d6b8;--hill2:#84c79e;--gs1:#93d392;--gs2:#4fa86a;--leaf-a:#2fa05a;--leaf-b:#43b86c;--leaf-c:#238a4d;--pine:#1f7a4a;--trunk:#7a5230;--blossom:#f6a8c4;--blossom2:#e56f9c;--day:1;--night:0;}

.scene{border-radius:18px;overflow:hidden;border:1px solid color-mix(in srgb,var(--mint) 24%,var(--line));background:var(--sky1);box-shadow:0 12px 28px -18px rgba(17,55,39,.42)}

.scene .sun{fill:var(--sunc)}.scene .glow{fill:var(--sunc);opacity:.25}

.scene .bl{fill:var(--blossom)}.scene .bl2{fill:var(--blossom2)}.scene .flowers{transform-box:fill-box;transform-origin:center;animation:flower-open .7s ease-out both}.scene .flowers circle{filter:drop-shadow(0 1px 1px rgba(92,39,57,.2))}
