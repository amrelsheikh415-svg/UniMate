<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#14172b;--mute:#666b85;--line:#e1e3ee;--brand:#1f3a93;--accent:#f26a1b;--ok:#0f9d6e;--bad:#c2415a;--btn:#eef0f8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--ink:#eceefb;--mute:#9aa0bd;--line:#2a2f4a;--brand:#7c97ff;--accent:#ff8a47;--ok:#3ccf9a;--bad:#ff7b92;--btn:#232844}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--btn);border-radius:8px;padding:5px 12px}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.danger{color:var(--bad)}
input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
#login{max-width:360px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
#login h1{margin:0 0 16px;font-size:22px}
#login label{display:block;margin:10px 0 4px;font-weight:600}
#login button{width:100%;margin-top:16px;padding:10px}
.err{color:var(--bad);margin-top:10px;min-height:1.4em}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header h1{margin:0;font-size:22px;flex:1}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
nav button{border:0;background:none;padding:6px 14px}
nav button[aria-selected=true]{background:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{color:var(--mute);font-size:13px}
.stat.hot b{color:var(--accent)}
.bar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.bar input{max-width:320px}.bar .sp{flex:1}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mute);white-space:nowrap}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mute);direction:ltr;text-align:start}
.tag{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);margin-inline-end:4px}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.adm{color:var(--accent);border-color:var(--accent)}
.act{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;max-width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px;font-size:16px}
.pwbox{font:700 1.5rem ui-monospace,monospace;direction:ltr;text-align:center;padding:12px;background:var(--bg);border-radius:8px;margin:12px 0;user-select:all;word-break:break-all}
dialog .act{justify-content:flex-end}
#toast{position:fixed;inset-inline:0;bottom:16px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px}
</style>
</head>
<body>
<form id="login" hidden>
  <h1>لوحة الإدارة</h1>
  <label for="em">الإيميل</label><input id="em" type="email" autocomplete="username" required dir="ltr">
  <label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" required dir="ltr">
  <button class="primary" type="submit">دخول</button>
  <div class="err" id="lerr" role="alert"></div>
</form>
<div class="wrap" id="app" hidden>
  <header><h1>لوحة الإدارة</h1><nav role="tablist" id="tabs"></nav><button id="out">خروج</button></header>
  <main id="main"></main>
</div>
<div id="toast" role="status" hidden></div>

async function authCall(grant, body) {

async function getToken() {

  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 403 ? "الحساب ده مش أدمن" : (j.error || "حصل خطأ"));

}

  const mk = (v, ph) => { const i = h("input", { type: "number", min: 0, max: 100000, inputmode: "numeric", placeholder: ph, value: v ?? "" }); i.style.cssText = "direction:ltr;text-align:center"; return i; };
  const ai = mk(d0.ai_limit, "افتراضي (" + d0.defaults.ai + ")"), qz = mk(d0.quiz_limit, "افتراضي (" + d0.defaults.quiz + ")");
  const row = (t, used, lim, inp) => h("div", { style: "margin:12px 0" }, h("div", { style: "display:flex;justify-content:space-between;margin-bottom:4px" }, h("b", {}, t), h("span", { style: "color:var(--mute);font-size:13px" }, "اتستخدم النهاردة: " + used + " من " + lim)), inp);
  const d = h("dialog", {}, h("h3", {}, "حدود اليوم لـ " + niceId(u.email)),
    h("p", { style: "margin:0;color:var(--mute);font-size:13px" }, "سيب الخانة فاضية لو عايز الحد الافتراضي. الحد بيتجدد كل يوم على توقيت القاهرة."),
    row("رسائل المساعد", d0.ai_used, d0.ai_limit ?? d0.defaults.ai, ai), row("الاختبارات", d0.quiz_used, d0.quiz_limit ?? d0.defaults.quiz, qz),
    h("div", { class: "act" },
      h("button", { class: "primary", onclick: async () => { try { await api("set", { id: u.id, ai_limit: ai.value, quiz_limit: qz.value }, "admin-limits"); toast("اتحفظت الحدود"); d.remove(); } catch (e) { toast(e.message); } } }, "حفظ"),
      h("button", { onclick: async () => { try { await api("reset_usage", { id: u.id }, "admin-limits"); toast("اتصفّر استخدام النهاردة"); d.remove(); } catch (e) { toast(e.message); } } }, "تصفير استخدام النهاردة"),
      h("button", { onclick: () => d.remove() }, "إغلاق")));
  document.body.append(d); d.showModal(); d.addEventListener("close", () => d.remove());

const act = async (fn, msg) => { try { await fn(); toast(msg); show(); } catch (e) { toast(e.message); } };

const TABS = [["overview", "نظرة عامة"], ["users", "المستخدمين"], ["forest", "الغابة"], ["announce", "إعلان"], ["log", "السجل"]];
let tab = "overview", page = 1, q = "";
function drawTabs() {
  const n = $("tabs"); n.replaceChildren();
  TABS.forEach(([id, l]) => n.append(h("button", { role: "tab", "aria-selected": id === tab, onclick: () => { tab = id; page = 1; drawTabs(); show(); } }, l)));
}
async function show() {
  const m = $("main"); m.replaceChildren(h("div", { class: "empty" }, "بيحمّل…"));
  try { m.replaceChildren(await ({ overview, users, forest, announce, log })[tab]()); } catch (e) { m.replaceChildren(h("div", { class: "empty" }, e.message)); }
}
async function overview() {
  const s = await api("stats");
  const S = [["مسجّلين", s.users, 1], ["نشطين آخر 24 ساعة", s.active24h, 1], ["جدد آخر 7 أيام", s.new7d], ["حسابات موثّقة", s.verified], ["أجهزة (تذكيرات)", s.devices], ["اشتراكات إشعارات", s.push], ["إشعارات لسه متبعتتش", s.outboxPending], ["أشجار الغابة", s.trees], ["أعضاء الغرف", s.rooms]];
  let sec = null; try { sec = await api("x", {}, "admin-security"); } catch (e) {}
  const cards = h("div", { class: "grid" }, S.map(([l, v, hot]) => h("div", { class: "stat" + (hot ? " hot" : "") }, h("b", {}, String(v)), h("span", {}, l))));
  if (!sec) return cards;
  const sc = h("div", { class: "grid", style: "margin-top:12px" },
    h("div", { class: "stat" + (sec.failed24h ? " hot" : "") }, h("b", {}, String(sec.failed24h)), h("span", {}, "محاولات دخول فاشلة (24 ساعة)")),
    h("div", { class: "stat" + (sec.lockedNow ? " hot" : "") }, h("b", {}, String(sec.lockedNow)), h("span", {}, "حسابات مقفولة دلوقتي")));
  const tb = sec.targets.length ? h("div", { class: "tw", style: "margin-top:12px" }, h("table", {}, h("thead", {}, h("tr", {}, ["الحساب", "محاولات فاشلة", "آخر محاولة", "الحالة"].map(x => h("th", {}, x)))),
    h("tbody", {}, sec.targets.map(t => h("tr", {}, h("td", {}, niceId(t.id)), h("td", {}, String(t.fails)), h("td", {}, fmt(t.last)), h("td", {}, t.locked ? h("span", { class: "tag bad" }, "مقفول مؤقتًا") : "—")))))) : null;
  return h("div", {}, cards, h("h2", { style: "font-size:16px;margin:22px 0 4px" }, "الأمان"), sc, tb);
}
async function users() {
  const d = await api("users", { page });
  const rows = d.users.filter(u => !q || [u.email, niceId(u.email), u.name, u.university].join(" ").toLowerCase().includes(q.toLowerCase()));
  const body = rows.length ? rows.map(u => {
    const banned = u.banned_until && new Date(u.banned_until) > new Date();
    return h("tr", {},
      h("td", {}, u.name || niceId(u.email) || "بدون اسم", h("small", {}, niceId(u.email))),
      h("td", {}, [u.university, u.study_year].filter(Boolean).join(" - ") || "—"),
      h("td", {}, fmt(u.created_at)), h("td", {}, fmt(u.last_seen_at || u.last_sign_in_at)),
      h("td", {}, u.is_admin && h("span", { class: "tag adm" }, "أدمن"), u.verified && h("span", { class: "tag ok" }, "موثّق"), banned && h("span", { class: "tag bad" }, "محظور")),
      h("td", {}, h("div", { class: "act" },
        h("button", { onclick: () => act(() => api("verify", { id: u.id, value: !u.verified }), u.verified ? "اتلغى التوثيق" : "اتوثّق الحساب") }, u.verified ? "إلغاء التوثيق" : "توثيق"),
        h("button", { onclick: () => limitsDlg(u) }, "الحدود"),
        !u.is_admin && h("button", { onclick: () => resetPw(u) }, "كلمة مرور جديدة"),
        !u.is_admin && h("button", { class: "danger", onclick: () => { let reason; if (!banned) { reason = prompt("سبب الحظر (اختياري):"); if (reason === null) return; } act(() => api(banned ? "unban" : "ban", { id: u.id, reason }), banned ? "اتفك الحظر" : "اتحظر الحساب"); } }, banned ? "فك الحظر" : "حظر"),
        !u.is_admin && h("button", { class: "danger", onclick: () => { if (confirm("حذف الحساب نهائيًا هو وبياناته (وأشجاره وإشعاراته)؟ مينفعش تتراجع.")) act(() => api("delete_user", { id: u.id }), "اتحذف الحساب"); } }, "حذف"))));
  }) : [h("tr", {}, h("td", { colspan: 6, class: "empty" }, "مفيش مستخدمين مطابقين."))];
  const pages = Math.max(1, Math.ceil(d.total / 50));
  return h("div", {},
    h("div", { class: "bar" },
      h("input", { type: "search", placeholder: "ابحث بالاسم أو اليوزر في الصفحة دي", value: q, oninput: e => { q = e.target.value; clearTimeout(tt); tt = setTimeout(show, 250); } }),
      h("span", { class: "sp" }), h("span", {}, d.total + " مستخدم"),
      h("button", { disabled: page <= 1, onclick: () => { page--; show(); } }, "السابق"), h("span", {}, page + " / " + pages),
      h("button", { disabled: page >= pages, onclick: () => { page++; show(); } }, "التالي")),
    h("div", { class: "tw" }, h("table", {}, h("thead", {}, h("tr", {}, ["المستخدم", "الجامعة", "اتسجّل", "آخر نشاط", "الحالة", "إجراءات"].map(x => h("th", {}, x)))), h("tbody", {}, body))));
}
async function forest() {
  const d = await api("trees");
  const body = d.trees.length ? d.trees.map(t => h("tr", {},
    h("td", {}, t.name || "طالب", h("small", {}, (t.pid || "").slice(0, 8))), h("td", {}, t.minutes + " دقيقة"), h("td", {}, fmt(t.planted_at)),
    h("td", {}, h("div", { class: "act" },
      h("button", { class: "danger", onclick: () => act(() => api("delete_tree", { id: t.id }), "اتحذفت الشجرة") }, "حذف الشجرة"),
      h("button", { class: "danger", onclick: () => { if (confirm("حذف كل أشجار وعضويات الجهاز ده؟")) act(() => api("delete_pid", { pid: t.pid }), "اتمسح الجهاز من الغابة"); } }, "مسح الجهاز"))))
  ) : [h("tr", {}, h("td", { colspan: 4, class: "empty" }, "الغابة فاضية."))];
  return h("div", {}, h("div", { class: "tw" }, h("table", {}, h("thead", {}, h("tr", {}, ["الاسم", "المدة", "وقت الزراعة", "إجراءات"].map(x => h("th", {}, x)))), h("tbody", {}, body))));
}
async function announce() {
  const d = await api("announcements"), cur = d.items.find(x => x.active);
  const ta = h("textarea", { maxlength: 300, rows: 3, placeholder: "اكتب نص الإعلان (حد أقصى 300 حرف). هيظهر كشريط فوق التطبيق عند كل المستخدمين." });
  ta.style.cssText = "width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit";
  return h("div", {},
    h("div", { class: "stat", style: "margin-bottom:12px" }, h("span", {}, "الإعلان الشغال دلوقتي"), h("b", { style: "font-size:16px;font-weight:600" }, cur ? cur.message : "مفيش إعلان"),
      cur && h("div", { class: "act", style: "margin-top:8px" }, h("button", { class: "danger", onclick: () => act(() => api("announce_off"), "اتوقّف الإعلان") }, "إيقاف الإعلان"))),
    ta, h("div", { class: "act", style: "margin-top:8px" }, h("button", { class: "primary", onclick: () => { if (ta.value.trim()) act(() => api("announce", { message: ta.value }), "اتنشر الإعلان"); else toast("اكتب نص الإعلان"); } }, "نشر الإعلان")));
}
const ACT = { ban: "حظر", unban: "فك حظر", verify: "توثيق", unverify: "إلغاء توثيق", reset_password: "كلمة مرور جديدة", delete_user: "حذف حساب", delete_tree: "حذف شجرة", delete_device: "مسح جهاز", announce: "نشر إعلان", announce_off: "إيقاف إعلان", set_limits: "تعديل الحدود", reset_usage: "تصفير الاستخدام" };
async function log() {
  const d = await api("log");
  const body = d.items.length ? d.items.map(x => h("tr", {}, h("td", {}, fmt(x.created_at)), h("td", {}, niceId(x.admin_email)), h("td", {}, ACT[x.action] || x.action), h("td", {}, h("span", { dir: "auto" }, niceId(x.target) || "—")), h("td", {}, x.detail || "—"))) : [h("tr", {}, h("td", { colspan: 5, class: "empty" }, "مفيش إجراءات لسه."))];
  return h("div", { class: "tw" }, h("table", {}, h("thead", {}, h("tr", {}, ["الوقت", "الأدمن", "الإجراء", "على", "تفاصيل / سبب"].map(x => h("th", {}, x)))), h("tbody", {}, body)));
}
async function gate() {
  const ok = await getToken();
  $("login").hidden = !!ok; $("app").hidden = !ok;
  if (ok) { drawTabs(); show(); }
}
$("login").addEventListener("submit", async e => {
  e.preventDefault(); $("lerr").textContent = "";
  const b = $("login").querySelector("button"); b.disabled = true; b.textContent = "بيدخل…";
  try { await authCall("password", { email: $("em").value.trim(), password: $("pw").value }); await gate(); }
  catch (err) { $("lerr").textContent = err.message === "Failed to fetch" ? "مفيش اتصال بالسيرفر." : err.message; }

gate();
</script>
</body>
</html>
